name: Release

on:
  push:
    branches:
      - master

jobs:
  # Maintains a release PR that bumps lib/procodile/version.rb and the CHANGELOG
  # from Conventional Commit messages. Merging that PR is what cuts a release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-please

  release:
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # The release workflow runs on master, after the release PR is merged, so
      # nothing has re-run the suite against the merge result. Publishing is
      # irreversible -- a pushed version number can be yanked but never reused --
      # so gate the push on a green suite rather than assuming.
      - name: Run tests
        run: bundle exec rspec -Ilib

      - name: Build gem
        run: gem build *.gemspec

      - name: Setup credentials
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:rubygems_api_key: ${RUBYGEMS_API_KEY}\n" > $HOME/.gem/credentials
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

      - name: Publish to RubyGems
        run: gem push *.gem
